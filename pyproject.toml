[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_price_compare"
version = "0.1.0"
description = "A terminal TUI tool to automatically fetch and compare LLM pricing from official sources and OpenRouter"
readme = "README.md"
authors = [
    {name = "Moha-Master", email = "hongkongreporter@outlook.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "PyYAML",
    "textual",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.scripts]
llm-price = "llm_price_compare.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_price_compare*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"llm_price_compare" = ["*.tcss"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
